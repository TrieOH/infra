services:
  mox:
    image: r.xmox.nl/mox:latest
    container_name: mox
    restart: unless-stopped
    networks:
      - caddy-net
    ports:
      - "25:25"    # SMTP
      - "465:465"  # SMTPS
      - "587:587"  # submission
      - "993:993"  # IMAPS
      - "127.0.0.1:9090:9090" # Admin panel
    volumes:
      - ./config:/mox/config
      - ./data:/mox/data
      - ./certs:/mox/certs
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command: mox -config /mox/config/mox.conf serve
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/webmail || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  caddy-net:
    external: true
