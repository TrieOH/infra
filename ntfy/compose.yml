services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    container_name: ntfy
    restart: unless-stopped
    command:
      - serve
    environment:
      - TZ=UTC
    volumes:
      - ./data:/var/lib/ntfy
      - ./config/server.yml:/etc/ntfy/server.yml:ro
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
