services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=${FORGEJO_DOMAIN}
      - GITEA__server__SSH_DOMAIN=${FORGEJO_SSH_DOMAIN}
      - GITEA__server__ROOT_URL=${FORGEJO_ROOT_URL}
      - GITEA__server__SSH_PORT=${FORGEJO_SSH_PORT}
      - GITEA__server__START_SSH_SERVER=false
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${FORGEJO_DB_NAME}
      - GITEA__database__USER=${FORGEJO_DB_USER}
      - GITEA__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${FORGEJO_SECRET_KEY}
      - GITEA__oauth2__JWT_SECRET=${FORGEJO_JWT_SECRET}
      - GITEA__actions__ARTIFACT_RETENTION_DAYS=14
      - GITEA__repository__ENABLE_PUSH_CREATE_ORG=true
      - GITEA__repository__ENABLE_PUSH_CREATE_USER=true
    volumes:
      - ./data/forgejo:/data
    networks:
      caddy-net:
      forgejo-db:
      internal:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:12
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://forgejo-dind:2375
    networks:
      - internal
    volumes:
      - ./runner/config.yml:/data/config.yml
      - ./runner/data:/data
    command: /bin/sh -c "sleep 5 && forgejo-runner daemon --config /data/config.yml"

  forgejo-dind:
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "3g"
    image: docker:dind
    container_name: forgejo-dind
    privileged: true
    restart: unless-stopped
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    networks:
      - internal
      - caddy-net
    volumes:
      - forgejo-dind-data:/var/lib/docker
      - buildkit-cache:/var/cache/buildkit
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2375/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: forgejo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${FORGEJO_DB_NAME}
      - POSTGRES_USER=${FORGEJO_DB_USER}
      - POSTGRES_PASSWORD=${FORGEJO_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - forgejo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGEJO_DB_USER} -d ${FORGEJO_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgejo-dind-data:
  buildkit-cache:

networks:
  caddy-net:
    external: true
  forgejo-db:
    internal: true
  internal:
    driver: bridge
    internal: false
