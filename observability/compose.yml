services:
  victoria-metrics:
    # Pinned 2026-08-18 (latest stable at the time).
    image: victoriametrics/victoria-metrics:v1.150.0
    container_name: victoria-metrics
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:8428
      - --promscrape.config=/etc/victoria-metrics/scrape.yml
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - ./scrape.yml:/etc/victoria-metrics/scrape.yml:ro
    networks:
      - obs-net
      - caddy-net
    ports:
      - "127.0.0.1:8428:8428"

  victoria-logs:
    # Pinned 2026-08-18 (latest stable at the time).
    image: victoriametrics/victoria-logs:v1.52.0
    container_name: victoria-logs
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:9428
    volumes:
      - victoria_logs_data:/victoria-logs-data
    networks:
      - obs-net
      - caddy-net
    ports:
      - "127.0.0.1:9428:9428"

  victoria-traces:
    # Pinned 2026-08-18 (latest stable at the time).
    image: victoriametrics/victoria-traces:v0.11.0
    container_name: victoria-traces
    restart: unless-stopped
    command:
      - --retentionPeriod=7d
      - --httpListenAddr=:10428
    volumes:
      - victoria_traces_data:/victoria-traces-data
    networks:
      - obs-net
      - caddy-net
    ports:
      - "127.0.0.1:10428:10428"

  grafana:
    # Pinned 2026-08-18 after 'latest' drift broke Caddy->Grafana DNS (502).
    # Bump deliberately: docker compose pull grafana && docker compose up -d grafana
    image: grafana/grafana:13.1.3
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GF_INSTALL_PLUGINS: victoriametrics-metrics-datasource,victoriametrics-logs-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./provisioning/alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
    networks:
      - obs-net
      - caddy-net
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - victoria-metrics
      - victoria-logs
      - victoria-traces
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  node-exporter:
    # Host metrics for Grafana alerts (added 2026-08-26, incident postmortem:
    # VM previously scraped only the 4 app services, so nothing alerted when
    # the host pegged 100% CPU for 18 min).
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --no-collector.wifi
      - --no-collector.ethtool
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - obs-net

networks:
  obs-net:
    external: true
  caddy-net:
    external: true

volumes:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  grafana_data:
