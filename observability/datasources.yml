apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs:9428

  - name: VictoriaTraces
    uid: victoriatraces
    type: jaeger
    access: proxy
    url: http://victoria-traces:10428/select/jaeger

  # LogsQL endpoint on Victoria Traces — same query API as VictoriaLogs.
  # Used for trace analytics (volume/duration stats via LogsQL).
  - name: VictoriaTracesLogs
    uid: victoriatraces-logs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-traces:10428
